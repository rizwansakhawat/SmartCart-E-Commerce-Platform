<!-- AI Chatbot Widget -->
<div class="ai-chatbot-widget" id="chatbotWidget">
    <div class="chatbot-header">
        <h5><i class="fas fa-robot"></i> SmartCart AI Assistant</h5>
        <button class="btn-close-chat" onclick="toggleChatbot()">×</button>
    </div>
    <div class="chatbot-messages" id="chatMessages">
        <div class="bot-message">
            <p>👋 Hi! I'm your SmartCart AI assistant. I can help you with:</p>
            <ul style="margin: 10px 0; padding-left: 20px; font-size: 13px;">
                <li>Finding products</li>
                <li>Tracking orders</li>
                <li>Answering questions</li>
                <li>Product recommendations</li>
            </ul>
        </div>
    </div>
    <div class="chatbot-input">
        <input type="text" id="chatInput" placeholder="Ask me anything..." onkeypress="handleChatKeyPress(event)">
        <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<button class="chatbot-toggle-btn" onclick="toggleChatbot()">
    <i class="fas fa-comments"></i>
</button>

<style>
.ai-chatbot-widget {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 380px;
    height: 550px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    display: none;
    flex-direction: column;
    z-index: 1000;
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chatbot-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 18px;
    border-radius: 15px 15px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
}

.chatbot-header h5 {
    margin: 0;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.btn-close-chat {
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
    transition: transform 0.2s;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-close-chat:hover {
    transform: scale(1.2);
}

.chatbot-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f8f9fa;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.chatbot-messages::-webkit-scrollbar {
    width: 6px;
}

.chatbot-messages::-webkit-scrollbar-track {
    background: #e9ecef;
    border-radius: 10px;
}

.chatbot-messages::-webkit-scrollbar-thumb {
    background: #667eea;
    border-radius: 10px;
}

.bot-message, .user-message {
    padding: 12px 15px;
    border-radius: 12px;
    max-width: 85%;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.bot-message {
    background: #e9ecef;
    color: #333;
    border-left: 4px solid #667eea;
    margin-right: auto;
}

.bot-message p {
    margin: 5px 0;
    font-size: 14px;
}

.bot-message ul {
    margin: 8px 0 0 0 !important;
}

.user-message {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    margin-left: auto;
    text-align: right;
    border-right: 4px solid #667eea;
}

.user-message p {
    margin: 0;
    font-size: 14px;
}

.chatbot-input {
    display: flex;
    padding: 12px;
    border-top: 1px solid #dee2e6;
    gap: 8px;
    background: white;
    border-radius: 0 0 15px 15px;
}

.chatbot-input input {
    flex: 1;
    padding: 12px 15px;
    border: 2px solid #e9ecef;
    border-radius: 20px;
    font-size: 14px;
    transition: all 0.3s;
    font-family: inherit;
}

.chatbot-input input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.chatbot-input button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}

.chatbot-input button:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
}

.chatbot-input button:active {
    transform: scale(0.95);
}

.chatbot-toggle-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 6px 25px rgba(102, 126, 234, 0.4);
    z-index: 999;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chatbot-toggle-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
}

.chatbot-toggle-btn:active {
    transform: scale(0.95);
}

@media (max-width: 480px) {
    .ai-chatbot-widget {
        width: 90vw;
        height: 70vh;
        bottom: 70px;
        right: 5vw;
    }

    .chatbot-toggle-btn {
        width: 55px;
        height: 55px;
        font-size: 22px;
    }
}
</style>

<script>
function toggleChatbot() {
    const widget = document.getElementById('chatbotWidget');
    const btn = document.querySelector('.chatbot-toggle-btn');
    
    if (widget.style.display === 'flex') {
        widget.style.display = 'none';
        btn.style.display = 'flex';
    } else {
        widget.style.display = 'flex';
        btn.style.display = 'none';
        document.getElementById('chatInput').focus();
    }
}

function handleChatKeyPress(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    
    if (!message) return;
    
    // Add user message to chat
    addMessageToChat(message, 'user');
    input.value = '';
    input.focus();
    
    // Send to backend
    try {
        const response = await fetch('/ai/chat/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ message: message })
        });
        
        const data = await response.json();
        
        if (data.success) {
            addMessageToChat(data.response, 'bot');
        } else {
            addMessageToChat('Sorry, I encountered an error. Please try again.', 'bot');
        }
    } catch (error) {
        console.error('Chat error:', error);
        addMessageToChat('Sorry, I encountered a connection error. Please try again.', 'bot');
    }
}

function addMessageToChat(message, type) {
    const messagesDiv = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = type === 'user' ? 'user-message' : 'bot-message';
    messageDiv.innerHTML = `<p>${escapeHtml(message)}</p>`;
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function escapeHtml(text) {
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
}
</script>
